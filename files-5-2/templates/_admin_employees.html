    <!-- ============ EMPLOYEES MANAGEMENT ============ -->
    <div class="two-col">

        <div class="card slide-up">
            <h3 class="card-title">
                <span data-i18n="admin.employees.title">Employés</span>
                ({{ employees|length }})
            </h3>

            <!-- Search bar for employees -->
            <div class="search-bar">
                <input type="text"
                       id="emp-search"
                       class="search-input"
                       placeholder="Rechercher un employé..."
                       data-i18n-placeholder="search.employees"
                       oninput="filterTable('emp-search', 'emp-table', 'emp-empty')">
                <span id="emp-empty" class="search-empty" style="display:none;"
                      data-i18n="search.empty">Aucun résultat trouvé</span>
            </div>

            <table class="data-table small-table" id="emp-table">
                <thead>
                    <tr>
                        <th data-i18n="th.id">ID</th>
                        <th data-i18n="th.username">Utilisateur</th>
                        <th data-i18n="th.action">Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for e in employees %}
                    <tr class="searchable-row" data-search="{{ e.id }} {{ e.username }}">
                        <td>{{ e.id }}</td>
                        <td>{{ e.username }}</td>
                        <td>
                            <button type="button"
                                    class="btn-mini"
                                    onclick="toggleEmpEdit({{ e.id }})"
                                    data-i18n="admin.edit">Modifier</button>
                            <form method="POST"
                                  action="{{ url_for('delete_employee', emp_id=e.id) }}"
                                  onsubmit="return confirm('Delete employee {{ e.username }}?');"
                                  class="inline-form">
                                <button type="submit"
                                        class="btn-mini danger"
                                        data-i18n="admin.delete">Supprimer</button>
                            </form>
                        </td>
                    </tr>
                    <!-- Hidden inline edit form -->
                    <tr id="emp-edit-{{ e.id }}" style="display:none; background: var(--surface-alt);">
                        <td colspan="3">
                            <form method="POST"
                                  action="{{ url_for('admin_update_employee', emp_id=e.id) }}"
                                  class="form grid-form" style="margin-top:6px;">
                                <div class="form-group">
                                    <label data-i18n="admin.create.username">Nom d'utilisateur</label>
                                    <input type="text" name="username" value="{{ e.username }}" required>
                                </div>
                                <div class="form-group">
                                    <label data-i18n="admin.create.password">Mot de passe</label>
                                    <input type="text" name="password" placeholder="••••" required>
                                </div>
                                <div class="form-group full-width">
                                    <button type="submit"
                                            class="btn btn-primary"
                                            data-i18n="admin.save">Enregistrer</button>
                                    <button type="button"
                                            class="btn-mini"
                                            onclick="toggleEmpEdit({{ e.id }})"
                                            data-i18n="admin.cancel">Annuler</button>
                                </div>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <div class="card slide-up" style="animation-delay:.05s">
            <h3 class="card-title" data-i18n="admin.create.title">Créer un nouvel employé</h3>
            <form method="POST" action="{{ url_for('create_employee') }}" class="form">
                <div class="form-group">
                    <label data-i18n="admin.create.username">Nom d'utilisateur</label>
                    <input type="text" name="username" placeholder="youssef" required>
                </div>
                <div class="form-group">
                    <label data-i18n="admin.create.password">Mot de passe</label>
                    <input type="text" name="password" placeholder="••••" required>
                </div>
                <button type="submit"
                        class="btn btn-primary btn-full"
                        data-i18n="admin.create.btn">Créer l'employé</button>
            </form>
        </div>
    </div>
