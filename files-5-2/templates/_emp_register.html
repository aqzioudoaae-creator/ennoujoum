    <!-- ============== REGISTER NEW CAR ============== -->
    <div class="card slide-up">
        <h3 class="card-title" data-i18n="emp.register.title">Enregistrer une nouvelle voiture</h3>

        <form method="POST" action="{{ url_for('register_car') }}" class="form grid-form">
            <div class="form-group">
                <label for="car_type" data-i18n="emp.field.car_type">Type de voiture</label>
                <select id="car_type" name="car_type" required>
                    <option value="" data-i18n="emp.opt.select">-- Sélectionner --</option>
                    <option value="Small" data-i18n="emp.opt.small">Petite</option>
                    <option value="Large" data-i18n="emp.opt.large">Grande</option>
                </select>
            </div>

            <div class="form-group">
                <label for="phone" data-i18n="emp.field.phone">Numéro de téléphone</label>
                <input type="text" id="phone" name="phone"
                       placeholder="+212 6 12 34 56 78" required>
            </div>

            <div class="form-group">
                <label for="wash_type" data-i18n="emp.field.wash_type">Type de lavage</label>
                <select id="wash_type" name="wash_type" required
                        onchange="updatePrice(this.value)">
                    <option value="" data-i18n="emp.opt.select">-- Sélectionner --</option>
                    {% for w, p in prices.items() %}
                        <option value="{{ w }}" data-price="{{ p }}">
                            {{ w }} — {{ p }} DH
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label data-i18n="emp.field.price">Prix</label>
                <div id="price-display" class="price-box">0 DH</div>
            </div>

            <div class="form-group full-width">
                <button type="submit" class="btn btn-primary btn-full" data-i18n="emp.btn.register">
                    Enregistrer et envoyer WhatsApp
                </button>
            </div>
        </form>
    </div>
