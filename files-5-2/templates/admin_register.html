{% extends "base.html" %}

{% block title %}Inscription Manager — Ennoujoum{% endblock %}

{% block content %}
<section class="login-page">
    <div class="login-card fade-in">
        <h2 data-i18n="register.admin.title">Inscription Manager</h2>
        <p class="muted" data-i18n="register.admin.subtitle">
            Créez votre compte. Il devra être approuvé par un manager existant avant utilisation.
        </p>

        <form method="POST" action="{{ url_for('admin_register') }}" class="form">
            <div class="form-group">
                <label for="username" data-i18n="login.field.username">Nom d'utilisateur</label>
                <input type="text" id="username" name="username"
                       placeholder="" required autofocus minlength="3">
            </div>

            <div class="form-group">
                <label for="password" data-i18n="login.field.password">Mot de passe</label>
                <input type="password" id="password" name="password"
                       placeholder="••••••••" required minlength="4">
            </div>

            <button type="submit" class="btn btn-primary btn-full" data-i18n="login.btn.register">S'inscrire</button>
        </form>

        <p class="muted small" style="margin-top:18px;">
            <span data-i18n="register.have_account">Déjà un compte ?</span>
            <a href="{{ url_for('admin_login') }}"
               style="color: var(--yellow-dark); font-weight:600;"
               data-i18n="login.btn.login">Connexion</a>
        </p>

        <a href="{{ url_for('home') }}" class="back-link" data-i18n="login.back">← Retour à l'accueil</a>
    </div>
</section>
{% endblock %}
